<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f26b54" />
  <meta name="description" content="SOLA TUBE — 動画を検索して楽しめるSOLAの動画サービス。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SOLA TUBE" />
  <meta property="og:description" content="SOLA TUBE — 動画を検索して楽しもう。" />
  <meta name="twitter:card" content="summary" />
  <title>SOLA TUBE</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root { color-scheme: light; --sola-orange: #f26b54; --sola-pink: #ec6d91; --sola-purple: #873e8b; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background: var(--bg-primary, #fff8f6); color: var(--text-primary, #29242d); }
    a { color: var(--link-color, #c54d75); }
    #sola-boot { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: linear-gradient(135deg, #f58c4e, #e85f83 55%, #813c92); color: white; transition: opacity .45s ease, visibility .45s ease; }
    #sola-boot.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #sola-boot .brand { font-size: clamp(2rem, 7vw, 4rem); font-weight: 850; letter-spacing: .1em; animation: rise .65s ease both; }
    #sola-boot .sub { text-align: center; font-size: .9rem; letter-spacing: .28em; opacity: .9; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="sola-boot" role="status" aria-label="SOLA TUBEを読み込み中"><div><div class="brand">SOLA</div><div class="sub">TUBE</div></div></div>
  <div id="app"></div>
  <noscript><p>動画を表示するにはJavaScriptを有効にしてください。</p></noscript>
  <script type="module" src="/src/main.js"></script>
  <script>
    (() => {
      const boot = document.getElementById('sola-boot');
      const dismiss = () => { if (boot) { boot.classList.add('hidden'); setTimeout(() => boot.remove(), 600); } };
      window.addEventListener('load', dismiss, { once: true });
      setTimeout(dismiss, 4500);
    })();
  </script>
</body>
</html>
